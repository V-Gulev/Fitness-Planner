<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sign in')}"></head>
<body>
<div class="page-shell">
    <header th:replace="~{fragments/layout :: header}"></header>
    <main id="main" class="account-layout" tabindex="-1">
        <div class="account-intro">
            <h1>Welcome<br>back.</h1>
            <p>Your training starts with the time and equipment you have.</p>
            <p>New here? <a th:href="@{/register}">Create an account</a>.</p>
        </div>
        <form class="account-form" th:action="@{/login}" method="post">
            <h2>Sign in</h2>
            <p class="feedback feedback-error" role="alert" th:if="${param.error}">The email or password is incorrect. Please try again.</p>
            <p class="feedback" role="status" th:if="${param.registered}">Account created. Sign in to set up your profile.</p>
            <p class="feedback" role="status" th:if="${param.logout}">You have signed out.</p>
            <div class="field">
                <label for="login-email">Email address</label>
                <input id="login-email" name="username" type="email" maxlength="254" autocomplete="username" required>
            </div>
            <div class="field">
                <label for="login-password">Password</label>
                <input id="login-password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <button class="button" type="submit">Sign in</button>
        </form>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</div>
</body>
</html>
