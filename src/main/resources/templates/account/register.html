<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Create account')}"></head>
<body>
<div class="page-shell">
    <header th:replace="~{fragments/layout :: header}"></header>
    <main id="main" class="account-layout" tabindex="-1">
        <div class="account-intro">
            <h1>Start with<br>your goals.</h1>
            <p>Create an account to save your training days, equipment, and exercise preferences.</p>
            <p>Already have an account? <a th:href="@{/login}">Sign in</a>.</p>
        </div>
        <form class="account-form" th:action="@{/register}" th:object="${registrationForm}" method="post">
            <h2>Create your account</h2>
            <div class="feedback feedback-error" role="alert" th:if="${#fields.hasErrors('*')}">
                <p>Please check the following:</p>
                <ul><li th:each="error : ${#fields.allErrors()}" th:text="${error}"></li></ul>
            </div>
            <div class="field">
                <label for="email">Email address</label>
                <input id="email" type="email" th:field="*{email}" maxlength="254" autocomplete="username" required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" minlength="10" maxlength="64"
                       autocomplete="new-password" aria-describedby="password-help" required>
                <p class="field-help" id="password-help">Use 10–64 characters. Choose a password unique to this account.</p>
            </div>
            <div class="field">
                <label for="confirmPassword">Confirm password</label>
                <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required>
            </div>
            <button class="button" type="submit">Create account</button>
        </form>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</div>
</body>
</html>
