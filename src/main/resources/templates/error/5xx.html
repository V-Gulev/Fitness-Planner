<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Something went wrong')}"></head>
<body>
<div class="page-shell">
    <header th:replace="~{fragments/layout :: header}"></header>
    <main id="main" class="error-content" tabindex="-1">
        <h1>Something went wrong.</h1>
        <p>We couldn’t load this page. Return home and try again.</p>
        <a class="button" th:href="@{/}">Return to home</a>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
</div>
</body>
</html>
